<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ngoại tuyến · Triệu Lộc</title>
<meta name="theme-color" content="#3f5f23">
<style>
  :root { color-scheme: light dark; --bg:#faf6ec; --ink:#23361a; --soft:#5b5747; --btn:#3f5f23; --btnInk:#faf6ec; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161b13; --ink:#e3edcc; --soft:#b8b29e; --btn:#a9c77a; --btnInk:#161b13; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink); font-family: system-ui, sans-serif; padding:16px; text-align:center; }
  h1 { font-family: Georgia, serif; font-size: 1.9rem; margin: 16px 0 8px; }
  p { color: var(--soft); max-width: 30rem; line-height: 1.6; margin: 6px auto; }
  button { margin-top: 20px; background: var(--btn); color: var(--btnInk); border: 0; border-radius: 999px; padding: 12px 24px; font-size: 1rem; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" width="88" height="88" alt="" style="border-radius:22px">
  <h1>Bạn đang ngoại tuyến</h1>
  <p>Trang này chưa được lưu trên máy. Những trang bạn đã xem trước đó vẫn mở được khi không có mạng.</p>
  <p lang="en">You're offline. Pages you've visited before still work without a connection.</p>
  <button type="button" onclick="location.reload()">Thử lại · Retry</button>
</main>
</body>
</html>
